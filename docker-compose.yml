services:
  postgres:
    image: postgres:16-alpine
    container_name: antam-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-antam_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-antam_password}
      POSTGRES_DB: ${POSTGRES_DB:-antam_hospital}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-antam_user} -d ${POSTGRES_DB:-antam_hospital}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: antam-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-antam_user}:${POSTGRES_PASSWORD:-antam_password}@postgres:5432/${POSTGRES_DB:-antam_hospital}?schema=public
      JWT_SECRET: ${JWT_SECRET:-antam-hospital-dev-jwt-secret-change-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    command: >
      sh -c "npx prisma migrate deploy && npx prisma db seed && node dist/server.js"

  frontend:
    image: node:22-alpine
    container_name: antam-frontend
    restart: unless-stopped
    working_dir: /app
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:4000/api}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    command: >
      sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"

volumes:
  postgres_data:
  frontend_node_modules:
